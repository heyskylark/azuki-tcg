; JAX GPU-vec battle-only smoke (copy of azuki.ini with [vec] backend=Jax).
; NOTE: only ability-free gameplay is implemented in the JAX engine; pool
; decks with ability cards train as a self-consistent MDP (abilities no-op).
[base]
env_name = azuki_jax_smoke

[vec]
backend = Jax
; 512 (not 1024): the trainer requires total_agents (2*num_envs) <=
; batch_size/bptt_horizon = 1024 segments.
num_envs = 512

[env]
deck_pool_path = .codex/docs/azuki_tcg_decks_final.json
deck_building_enabled = false

[policy]
model_version = metadata_v1
critic_head_type = full_lstm_mlp
win_prob_aux_enabled = true
win_prob_aux_coef = 0.05
subaction_temperature_initial = 1.2
subaction_temperature_final = 1.2
subaction_temperature_anneal_start_frac = 0.6
subaction_temperature_anneal_end_frac = 0.9
smoothing_eps_initial = 0.05
smoothing_eps_final = 0.05
smoothing_eps_anneal_start_frac = 0.6
smoothing_eps_anneal_end_frac = 0.9

[league]
enable = False
state_path = experiments/league_state.json
frozen_ratio = 0.075
randomize_learner_seat = True
activate_after_steps = 0
checkpoint_add_interval = 1
eval_interval = 1
eval_mode = inline
quick_eval_interval = 3
quick_eval_episodes = 8
full_eval_interval = 12
full_eval_episodes = 48
eval_episodes = 8
eval_max_steps = 400
keep_recent = 6
keep_mid = 4
keep_old = 3
min_candidate_epoch_gap = 1
promotion_min_winrate_vs_champion = 0.55
promotion_baseline_count = 2
promotion_min_winrate_vs_baseline = 0.50
promotion_min_games_vs_champion = 16
promotion_min_games_vs_baseline = 8
promotion_wilson_confidence_z = 1.28
opponent_dir =
opponent_checkpoints =

[train]
device = cuda
total_timesteps = 200000
batch_size = 16384
minibatch_size = 4096
bptt_horizon = 16
update_epochs = 2
vf_coef = 1.0
ent_coef = 0.01
ent_coef_anneal_initial = 0.01
ent_coef_anneal_final = 0.01
ent_coef_anneal_start_frac = 0.6
ent_coef_anneal_end_frac = 0.9
checkpoint_interval = 25000
max_checkpoints = 24
gamma = 0.99
gae_lambda = 0.95
learning_rate = 0.015
adam_beta1 = 0.9
compile = False
