; SMOKE config for the latest deck-building model (embedded text effects,
; model-driven deck building flow + full battle flow). Derived from
; azuki_deckbuild_3090.ini but shrunk to run a handful of full episodes
; quickly on a single GPU. League is disabled to keep the smoke fast and
; avoid the league-eval memory paths; the model + deckbuild + battle flow
; are exactly the production ones.
[base]
env_name = azuki_local

[vec]
backend = Multiprocessing
num_envs = 32
num_workers = 8
batch_size = 16
zero_copy = True

[env]
deck_building_enabled = true
deck_pool_path = .codex/docs/azuki_garden_arena_2026-08-15_decks.json

[policy]
model_version = metadata_v1
critic_head_type = full_lstm_mlp
win_prob_aux_enabled = true
win_prob_aux_coef = 0.05
subaction_temperature_initial = 1.2
subaction_temperature_final = 1.05
subaction_temperature_anneal_start_frac = 0.6
subaction_temperature_anneal_end_frac = 0.9
smoothing_eps_initial = 0.05
smoothing_eps_final = 0.01
smoothing_eps_anneal_start_frac = 0.6
smoothing_eps_anneal_end_frac = 0.9

[league]
enable = False

[train]
device = cuda
use_rnn = True
total_timesteps = 40000
align_total_timesteps_up = True
batch_size = 4096
min_batch_size = 4096
bptt_horizon = 16
update_epochs = 1
minibatch_size = 1024
vf_coef = 1.0
ent_coef = 0.01
ent_coef_anneal_initial = 0.01
ent_coef_anneal_final = 0.002
ent_coef_anneal_start_frac = 0.6
ent_coef_anneal_end_frac = 0.9
checkpoint_interval = 1000000
max_checkpoints = 2
gamma = 0.99
gae_lambda = 0.95
learning_rate = 0.003
adam_beta1 = 0.9
precision = bfloat16
compile = False
