[base]
env_name = azuki_local

[vec]
backend = Multiprocessing
num_envs = 12
num_workers = 12
; 6 = double-buffering: two 480-agent groups alternate, hiding env stepping
; behind the other group's rollout forward.
batch_size = 6
zero_copy = True

[env]
deck_pool_path = .codex/docs/azuki_garden_arena_2026-08-15_decks.json
native = true
native_envs_per_instance = 40

[policy]
critic_head_type = full_lstm_mlp
win_prob_aux_enabled = true
win_prob_aux_coef = 0.05

[train]
device = cuda
total_timesteps = 100000
batch_size = auto
; 12288 divides update_epochs*batch (2*15360) into exactly 2 chunks: same
; 24,576 sample-passes as minibatch 8192 (which int-truncates 3.75 -> 3
; chunks) but with 2 Muon/Newton-Schulz steps per epoch instead of 3.
minibatch_size = 12288
bptt_horizon = 16
update_epochs = 2
vf_coef = 1.0
ent_coef = 0.01
checkpoint_interval = 25000
max_checkpoints = 24
gamma = 0.99
gae_lambda = 0.95
learning_rate = 0.015
adam_beta1 = 0.9
precision = bfloat16
; Compile serves the train path only (encode/decode; backward compiles too).
; The rollout forward instead replays manual CUDA graphs, one per
; legal-action trim bucket, with sampling captured in-graph.
compile = True
compile_mode = default
cuda_graphs = True
