; Deck-building training on the NATIVE C path (draft phase in C) — RTX 3090.
; Derived from azuki_native_3090.ini (fixed-deck 7.1k SPS stack) with
; deck_building_enabled=true and the deck-building league/anneal recipe from
; azuki_deckbuild_3090.ini. cuda_graphs stays off in v1: league row-splitting
; is incompatible with whole-batch static capture (revisit later).
[base]
env_name = azuki_local

[vec]
backend = Multiprocessing
num_envs = 12
num_workers = 12
; double-buffering: two groups alternate, hiding env stepping behind the
; other group's rollout forward
batch_size = 6
zero_copy = True

[env]
deck_building_enabled = true
deck_pool_path = .codex/docs/azuki_tcg_decks_final.json
native = true
native_envs_per_instance = 40

[policy]
model_version = metadata_v1
critic_head_type = full_lstm_mlp
win_prob_aux_enabled = true
win_prob_aux_coef = 0.05

[league]
enable = True
activate_after_steps = 0
frozen_ratio = 0.10
; windowed opponent sampling: one frozen policy per 8-epoch window -> rollout
; cost independent of pool size (fixes the 3.7k->1.6k SPS sag at pool 4)
frozen_window_epochs = 8
max_distinct_frozen = 1
randomize_learner_seat = True
checkpoint_add_interval = 1
eval_interval = 1
eval_mode = inline
quick_eval_interval = 6
quick_eval_episodes = 32
full_eval_interval = 24
full_eval_episodes = 48
eval_episodes = 8
eval_max_steps = 400
keep_recent = 2
keep_mid = 1
keep_old = 1
min_candidate_epoch_gap = 1
promotion_min_winrate_vs_champion = 0.55
promotion_baseline_count = 2
promotion_min_winrate_vs_baseline = 0.45
promotion_min_games_vs_champion = 16
promotion_min_games_vs_baseline = 32
promotion_wilson_confidence_z = 1.0
state_path = experiments/league/deckbuild_native_v1/league_state.json
opponent_dir = experiments/league/deckbuild_native_v1/opponents

[train]
device = cuda
use_rnn = True
total_timesteps = 15000000
align_total_timesteps_up = True
batch_size = auto
min_batch_size = 32768
bptt_horizon = 16
update_epochs = 1
; deck-context candidate tensors spike memory on >512-legal-action states;
; start conservative, raise after a soak
minibatch_size = 4096
vf_coef = 1.0
ent_coef = 0.01
ent_coef_anneal_initial = 0.01
ent_coef_anneal_final = 0.002
ent_coef_anneal_start_frac = 0.6
ent_coef_anneal_end_frac = 0.9
checkpoint_interval = 100
max_checkpoints = 24
gamma = 0.99
gae_lambda = 0.95
learning_rate = 0.003
adam_beta1 = 0.9
precision = bfloat16
; train-side-only compile (encode/decode roots); rollout stays eager in v1
compile = True
compile_mode = default
cuda_graphs = False
