; Single-host production recipe frozen from exact retained-credit p10730.
; The default horizon is the parent update, so launching without an explicit
; train.total_timesteps override is a safe no-op.
[base]
env_name = azuki_local
jsonl_log = train-ablation-1781126582/results/production_launch_v1/logs
tag = production
parent_manifest = train-ablation-1781126582/results/production_launch_v1/parent_p10730/manifest.json

[resume]
checkpoint = train-ablation-1781126582/results/production_launch_v1/parent_p10730/resume/model_azuki_local_010730.pt
load_optimizer = true
restart_lr_schedule = true
strict = true
auto_reset_critic = false

[vec]
backend = Multiprocessing
num_envs = 12
num_workers = 12
batch_size = 6
zero_copy = true

[env]
deck_building_enabled = true
deck_pool_path = .codex/docs/azuki_garden_arena_2026-08-15_decks.json
native = true
native_envs_per_instance = 40
draft_same_element_matchup_prob = 0.35
draft_cross_gate_replay_prob = 0.15
draft_uniform_assignment = true

[policy]
model_version = metadata_v1
critic_head_type = full_lstm_mlp
win_prob_aux_enabled = true
win_prob_aux_coef = 0.05
gate_id_embedding_enabled = false
deck_pick_smoothing_eps = 0.02

[league]
enable = true
activate_after_steps = 0
frozen_ratio = 0.40
frozen_window_epochs = 8
max_distinct_frozen = 1
randomize_learner_seat = true
checkpoint_add_interval = 1
eval_mode = native_panel
; Production evaluation runs out of process from the frozen protocol.
eval_interval = 100000
quick_eval_interval = 100000
full_eval_interval = 100000
promotion_mode = archive_panel
promotion_shadow_mode = true
promotion_archive_affects_training_pool = false
promotion_panel_refresh_epochs = 100000
promotion_panel_size = 4
promotion_archive_max_active = 6
promotion_eval_batch_envs = 12
promotion_schedule_seed = 42001701
promotion_reference_seed = 42009919
promotion_reference_seeds = 42009919,52009922
promotion_reference_deck_indices = 0,2,4,6,8,10,12,14,16
promotion_reference_holdout_deck_indices = 1,3,5,7,9,11,13,15,17
promotion_require_reference = true
promotion_reference_candidate_floor = 0.50
promotion_reference_noninferiority = -0.15
promotion_reference_paired_lcb_min = -0.18
promotion_reference_leap = 0.05
promotion_anchored_screen_pooled_floor = 0.35
promotion_anchored_screen_opponent_floor = 0.15
promotion_anchored_screen_seat_floor = 0.25
promotion_anchored_screen_relative_pooled_min = -0.08
promotion_anchored_screen_relative_opponent_floor = -0.20
promotion_anchored_screen_relative_seat_floor = -0.15
promotion_anchored_pooled_floor = 0.40
promotion_anchored_opponent_floor = 0.20
promotion_anchored_seat_floor = 0.35
promotion_anchored_relative_pooled_min = -0.02
promotion_anchored_relative_opponent_quorum_min = -0.05
promotion_anchored_relative_opponent_quorum_count = 3
promotion_anchored_relative_break_even_count = 2
promotion_anchored_relative_opponent_floor = -0.10
promotion_anchored_relative_seat_floor = -0.08
promotion_anchored_relative_paired_lcb_min = -0.05
promotion_anchored_leap_relative_pooled_min = -0.05
promotion_anchored_max_timeout_rate = 0.01
promotion_anchored_max_timeout_delta = 0.01
promotion_bootstrap_panel_path = train-ablation-1781126582/results/production_launch_v1/parent_p10730/config/panel-v1.json
production_anchor_checkpoint = train-ablation-1781126582/results/production_launch_v1/parent_p10730/anchors/production_anchor.pt
promotion_anchor_in_training_pool = false
quick_eval_episodes = 32
full_eval_episodes = 48
eval_episodes = 8
eval_max_steps = 1200
keep_recent = 6
keep_mid = 4
keep_old = 3
min_candidate_epoch_gap = 1
promotion_min_winrate_vs_champion = 0.55
promotion_baseline_count = 2
promotion_min_winrate_vs_baseline = 0.45
promotion_min_games_vs_champion = 16
promotion_min_games_vs_baseline = 32
promotion_wilson_confidence_z = 1.0
state_path = train-ablation-1781126582/results/production_launch_v1/runtime/league_state.json
promotion_state_path = train-ablation-1781126582/results/production_launch_v1/runtime/league_state_promotion.json
opponent_dir = train-ablation-1781126582/results/production_launch_v1/parent_p10730/opponents

[train]
device = cuda
seed = 42
use_rnn = true
; p10730 * 15,360. Override explicitly for the approved production horizon.
total_timesteps = 164812800
align_total_timesteps_up = true
batch_size = auto
min_batch_size = 32768
bptt_horizon = 16
update_epochs = 1
minibatch_size = 4096
vf_coef = 1.0
ent_coef = 0.002
ent_coef_anneal_initial = 0.002
ent_coef_anneal_final = 0.002
ent_coef_anneal_start_frac = 0.0
ent_coef_anneal_end_frac = 1.0
; Tiered scheduling derives its 50-update dispatcher from [artifacts].
checkpoint_interval = 50
max_checkpoints = 0
gamma = 0.99
gae_lambda = 0.95
learning_rate = 0.00003
adam_beta1 = 0.9
precision = bfloat16
compile = true
compile_mode = default
cuda_graphs = false

[process_env]
azk_reward_leader_delta_weight = 1.25
azk_reward_board_delta_weight = 0.35
azk_reward_noop_penalty = 0.02
azk_truncation_board_edge_weight = 0.45
azk_reward_untapped_ikz_weight = 0.15
azk_reward_shaping_anneal = 1
azk_reward_shaping_anneal_initial = 1.0
azk_reward_shaping_anneal_final = 0.15
azk_reward_shaping_anneal_warmup_episodes = 12
azk_reward_shaping_anneal_ramp_episodes = 40
azk_trainer_shaped_reward_anneal = 0
azk_trainer_shaped_reward_anneal_start_epoch = 0
azk_trainer_shaped_reward_anneal_end_epoch = 0
azk_portal_gp_bonus = 0.3
azk_portal_outcome_bonus = 0
azk_xgate_mask = 1
azk_pfsp = 1
azk_pfsp_power = 2.0
azk_early_tempo_bonus = 0.1
azk_early_tempo_cap = 4
azk_early_tempo_turns = 2
azk_early_tempo_dedup_portal_abilities = 1
azk_dmg_mitigation_bonus = 0.15
azk_dmg_mitigation_cap = 10
azk_entity_damage_exchange_per_hp = 0
azk_entity_damage_exchange_step_cap = 6
azk_generated_ikz_conversion_bonus = 0
azk_generated_ikz_conversion_step_cap = 4
azk_temp_charge_realization_bonus = 0.08
azk_temp_attack_realization_per_damage = 0.025
azk_temp_attack_realization_damage_cap = 4
azk_contextual_response_reserve_bonus = 0
azk_draft_vboot_coef = 0
azk_draft_sibdiff_coef = 0
azk_draft_sibdiff_cap = 0.05
azk_draft_aux_anneal = 1
azk_draft_ref_seat_prob = 0
azk_leader_terminal_credit_coef = 0
azk_draft_terminal_credit_coef = 0
azk_draft_episode_credit_coef = 1.0
azk_draft_episode_credit_clip = 0.2
azk_draft_episode_credit_batch_drafts = 80
azk_draft_episode_credit_update_interval = 4
azk_draft_episode_credit_baseline_coef = 0.05
azk_draft_episode_credit_seed = 420052
azk_draft_episode_credit_label_warmup_epochs = 10
azk_draft_prefix_probs =
azk_draft_prefix_lengths = 0,1,2,4
azk_draft_prefix_seed = 420053

[logging]
interval_updates = 10
stdout_interval_updates = 10
dashboard = false
metric_patterns = SPS,agent_steps,uptime,epoch,learning_rate,environment/draft_episode_credit/*,environment/league/*,environment/sampler/*,environment/anneal/*,environment/*timeout*,environment/*truncat*,environment/*invalid*,losses/policy_loss,losses/value_loss,losses/entropy,losses/approx_kl,losses/clipfrac,losses/explained_variance,losses/win_prob_aux_*,losses/draft_episode_credit_*,performance/*
sum_patterns = environment/draft_episode_credit/captured,environment/draft_episode_credit/labeled,environment/draft_episode_credit/completed_episodes,environment/draft_episode_credit/decisive_episodes,environment/draft_episode_credit/draw_episodes,environment/draft_episode_credit/win_episodes,environment/draft_episode_credit/loss_episodes,environment/draft_episode_credit/truncated_records,environment/draft_episode_credit/incomplete_episodes,losses/draft_episode_credit_examples
max_patterns = environment/*timeout*,environment/*truncat*,environment/*invalid*,losses/draft_episode_credit_gradient_norm
stdout_metric_patterns = SPS,agent_steps,epoch,learning_rate,environment/*timeout*,environment/*truncat*,environment/*invalid*,losses/policy_loss,losses/value_loss,losses/entropy,losses/approx_kl,losses/draft_episode_credit_loss

[artifacts]
tiered_checkpoints = true
recovery_interval_updates = 100
evaluation_interval_updates = 250
milestone_interval_updates = 1000
recovery_keep = 3
evaluation_keep = 12

[launch_gates]
minimum_median_sps = 1235
minimum_relative_sps = 0.95
maximum_timeout_truncation_rate = 0
maximum_incomplete_episodes = 0
require_finite_metrics = true
require_exact_update_accounting = true
require_checkpoint_parity = true
require_atomic_resume = true
