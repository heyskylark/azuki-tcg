[project]
name = "puffer_azuki_tcg"
version = "0.1.0"
description = "Azuki TCG PufferLib/PettingZoo RL training"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=0.29.1",
    "heavyball>=2.2.1",
    "neptune>=1.14.0",
    "pettingzoo>=1.24.1",
    "psutil>=7.1.3",
    "pufferlib",
]

[tool.uv.sources]
pufferlib = { git = "https://github.com/PufferAI/PufferLib.git", rev = "4.0" }
